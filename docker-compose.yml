version: '3.8'

services:
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development 
    container_name: edu_platform_api
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=edu_platform_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app 
      - /app/node_modules 
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  # 1. قاعدة البيانات (MySQL)
  mysql:
    image: mysql:8.0
    container_name: edu_platform_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: edu_platform_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # 2. واجهة إدارة الداتابيز (Adminer)
  adminer:
    image: adminer
    container_name: edu_platform_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network

  # 3. سيرفر الكاش (Redis)
  redis:
    image: redis:7-alpine
    container_name: edu_platform_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge